{% extends "base.html" %}
{% block title %}Cadastrar Turma{% endblock %}
{% block page_title %}Nova Turma{% endblock %}

{% block content %}
<div class="card max-w-lg">
    <h2>Cadastrar Nova Turma</h2>

    <form method="POST">
        <div class="form-group">
            <label for="nome">Nome da Turma *</label>
            <input type="text" id="nome" name="nome" required placeholder="Ex: 6ºA, 3ºB Médio">
        </div>
        <div class="form-group">
            <label for="turno">Turno *</label>
            <select id="turno" name="turno" required>
                <option value="">Selecione</option>
                {% for turno in turnos %}
                    <option value="{{ turno }}">{{ turno }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="flex gap-4 mt-4">
            <button type="submit" class="btn btn-success">Cadastrar Turma</button>
            <a href="{{ url_for('gestor_escolar.turmas') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
