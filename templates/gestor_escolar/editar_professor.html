{% extends "base.html" %}
{% block title %}Editar Professor{% endblock %}
{% block page_title %}Editar Professor{% endblock %}

{% block content %}
<div class="card max-w-lg">
    <h2>Editar Professor: {{ professor.nome }}</h2>

    <form method="POST">
        <div class="form-group">
            <label for="nome">Nome *</label>
            <input type="text" id="nome" name="nome" value="{{ professor.nome }}" required>
        </div>
        <div class="form-group">
            <label for="email">E-mail *</label>
            <input type="email" id="email" name="email" value="{{ professor.email }}" required>
        </div>
        <div class="form-group">
            <label for="telefone">Telefone</label>
            <input type="text" id="telefone" name="telefone" value="{{ professor.telefone or '' }}" placeholder="(00) 00000-0000">
        </div>
        
        <div class="form-group">
            <label for="disciplinas">Disciplinas (Separadas por vírgula)</label>
            <input type="text" id="disciplinas" name="disciplinas" 
                   value="{{ professor.disciplinas|map(attribute='nome')|join(', ') }}" 
                   placeholder="Ex: Matemática, Física, Química">
            <small class="text-gray-500 text-xs">Digite as disciplinas que este professor leciona.</small>
        </div>

        <div class="form-group">
            <label for="nova_senha">Nova Senha (opcional)</label>
            <input type="password" id="nova_senha" name="nova_senha" placeholder="Deixe em branco para manter">
        </div>
        <div class="form-group">
            <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" name="ativo" {% if professor.ativo %}checked{% endif %}> 
                <span class="font-medium">Ativo</span>
            </label>
        </div>
        
        <div class="flex gap-4 mt-4">
            <button type="submit" class="btn btn-primary">Atualizar Professor</button>
            <a href="{{ url_for('gestor_escolar.professores') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
