{% extends "base.html" %}
{% block title %}Editar Turma{% endblock %}
{% block page_title %}Editar Turma{% endblock %}

{% block content %}
<div class="card max-w-lg">
    <h2>Editar Turma: {{ turma.nome }}</h2>

    <form method="POST">
        <div class="form-group">
            <label for="nome">Nome da Turma *</label>
            <input type="text" id="nome" name="nome" value="{{ turma.nome }}" required placeholder="Ex: 6ºA, 3ºB Médio">
        </div>
        <div class="form-group">
            <label for="turno">Turno *</label>
            <select id="turno" name="turno" required>
                <option value="">Selecione</option>
                {% for turno_op in ['Matutino', 'Vespertino', 'Noturno'] %}
                    <option value="{{ turno_op }}" {% if turma.turno == turno_op %}selected{% endif %}>{{ turno_op }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="flex gap-4 mt-4">
            <button type="submit" class="btn btn-primary">Atualizar Turma</button>
            <a href="{{ url_for('gestor_escolar.turmas') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
