{% extends "base.html" %}
{% block title %}Cadastrar Professor{% endblock %}
{% block page_title %}Novo Professor{% endblock %}

{% block content %}
<div class="card max-w-lg">
    <h2>Cadastrar Novo Professor</h2>

    <form method="POST">
        <div class="form-group">
            <label for="nome">Nome *</label>
            <input type="text" id="nome" name="nome" required>
        </div>
        <div class="form-group">
            <label for="email">E-mail *</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="senha">Senha *</label>
            <input type="password" id="senha" name="senha" required>
        </div>
        <div class="form-group">
            <label for="telefone">Telefone (opcional)</label>
            <input type="text" id="telefone" name="telefone" placeholder="(00) 00000-0000">
        </div>
        
        <div class="form-group">
            <label for="disciplinas">Disciplinas (Separadas por vírgula)</label>
            <input type="text" id="disciplinas" name="disciplinas" placeholder="Ex: Matemática, Física, Química">
            <small class="text-gray-500 text-xs">Digite as disciplinas que este professor leciona.</small>
        </div>
        
        <div class="flex gap-4 mt-4">
            <button type="submit" class="btn btn-success">Cadastrar Professor</button>
            <a href="{{ url_for('gestor_escolar.professores') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
